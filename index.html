<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b66">
<meta name="description" content="নিজের প্রশ্ন বেছে JLPT অনুশীলন ও পরীক্ষা তৈরি করুন।">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>আমার পরীক্ষা 2.0</title>
</head>
<body>
<header><h1>আমার পরীক্ষা 2.0</h1><p>নিজের প্রশ্নে নিজের পরীক্ষা</p></header>
<main>
<nav class="tabs">
<button class="tab active" data-tab="make">পরীক্ষা তৈরি</button>
<button class="tab" data-tab="bank">প্রশ্ন যোগ</button>
<button class="tab" data-tab="results">ফলাফল</button>
</nav>
<section id="make" class="panel">
<h2>পরীক্ষার সেটিংস</h2>
<div class="grid">
<label>JLPT স্তর<select id="level"><option>N5</option><option>N4</option><option>N3</option><option>N2</option><option>N1</option></select></label>
<label>প্রশ্নের ধরন<select id="type"><option value="all">সব ধরন</option><option>MCQ</option><option>লিখিত</option><option>শূন্যস্থান</option><option>অনুবাদ</option></select></label>
<label>বিষয়<select id="subject"><option value="all">সব বিষয়</option><option>Vocabulary</option><option>Grammar</option><option>Kanji</option><option>Reading</option><option>Listening</option></select></label>
<label>সময় (মিনিট)<input id="minutes" type="number" min="1" value="15"></label>
</div>
<h3>প্রশ্ন বেছে নাও</h3><div id="questionList"></div>
<button id="start" class="primary">নির্বাচিত প্রশ্ন দিয়ে পরীক্ষা শুরু</button>
<div id="exam" hidden></div>
</section>
<section id="bank" class="panel" hidden>
<h2>নতুন প্রশ্ন যোগ করো</h2>
<label>প্রশ্নের স্তর<select id="qlevel"><option>N5</option><option>N4</option><option>N3</option><option>N2</option><option>N1</option></select></label>
<label>বিষয়<select id="qsubject"><option>Vocabulary</option><option>Grammar</option><option>Kanji</option><option>Reading</option><option>Listening</option></select></label>
<label>প্রশ্নের ধরন<select id="qtype"><option>MCQ</option><option>লিখিত</option><option>শূন্যস্থান</option><option>অনুবাদ</option></select></label>
<label>প্রশ্ন<textarea id="qtext" placeholder="প্রশ্ন লিখুন"></textarea></label>
<div id="choices"><label>অপশন ১<input class="choice" placeholder="অপশন ১"></label><label>অপশন ২<input class="choice" placeholder="অপশন ২"></label><label>অপশন ৩<input class="choice" placeholder="অপশন ৩"></label><label>অপশন ৪<input class="choice" placeholder="অপশন ৪"></label></div>
<label>সঠিক উত্তর / নমুনা উত্তর<input id="answer" placeholder="সঠিক উত্তর লিখুন"></label>
<button id="save" class="primary">প্রশ্ন সংরক্ষণ</button><p id="saveMsg" role="status"></p>
</section>
<section id="results" class="panel" hidden><h2>আগের ফলাফল</h2><div id="resultList">এখনো কোনো ফলাফল নেই।</div></section>
</main>
<footer>প্রশ্ন ও ফলাফল এই ডিভাইসের ব্রাউজারে সংরক্ষিত থাকে।</footer>
<script src="app.js"></script>
</body></html>
